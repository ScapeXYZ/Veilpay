openapi: 3.1.0
info:
  title: VeilPay API
  version: 1.2.0-draft
  description: >-
    VeilPay demo backend. Default mock mode preserves simulated payments and non-spendable
    invoice payloads. WALLET_BACKEND=zingo-cli enables a real, pinned, testnet-only wallet
    transport. HTTP execute stages an operation; only a separate interactive operator CLI
    can prepare/sign or broadcast, each under a distinct exact confirmation. Mainnet CLI
    execution is refused. No API exposes seeds, keys, private viewing material or raw history.
    Demo sessions separate customer and merchant roles but do not provide production identity.
    Writes require an exact configured Origin and session-bound X-CSRF-Token; POST operations
    also require Idempotency-Key except demo bootstrap. Same-key responses are immutable
    snapshots; use payment detail and verification for current state. Unknown outcomes hold
    reservations and are never automatically resent. The merchant independently scans its
    own wallet; exact receiver, amount, expected txid and three confirmations are required.
    Duplicate, conflicting, underpaid or reorg-related observations prevent acknowledgment.
    Acknowledgments are server-authenticated merchant statements, not cryptographic settlement
    proofs. Fees are separately approved by the operator; policy budgets track payment principal.
    Testnet transactions have no automatic development/test execution path. See the README and
    testnet guide for the required CLI source patches and manual operator procedure.
servers:
- url: http://localhost:4000/api
  description: local backend
tags:
- name: system
- name: session
- name: agents
- name: payments
- name: merchant
security:
- session: []
x-current-implementation:
  wallet: WALLET_BACKEND=zingo-cli uses only testnet, the exact pinned Zingo revision, waitsync patch, and structured-transport patch. WALLET_BACKEND=zingo remains a disabled adapter. Mock remains default.
  execution: HTTP execute only stages an immutable 202 snapshot in zingo-cli mode. A separate operator terminal requires exact confirmations for offline preparation and single-txid submission. Mainnet CLI mode is refused.
  verification: Independent merchant wallet Orchard history, receiver, exact zatoshis, expected txid, scan completion, and three confirmations are required. No sender assertion is used as receipt evidence.
  reorgs: Read-only reconciliation rechecks final manual operations and merchant receipts. Lost depth holds a reservation again; lost receipts reopen or expire the invoice and invalidate reliance on an acknowledgment.
  limitations: Orchard-only invoices, one transaction per preparation, no TEX/multistep sends, no automatic resending, no cryptographic settlement proofs or independent header-chain verification. Wallet scan errors return 503 and never fabricate absence.
  fees: Policy budgets cover transferred zatoshis. Operator approves a separate maximum network fee before signing, then the exact fee before broadcast.
paths:
  /health:
    get:
      tags:
      - system
      summary: Liveness + chain/wallet readiness
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /operator/mainnet/read-only:
    get:
      tags:
      - system
      summary: Read operator-only mainnet wallet observations
      description: >-
        Available only when NETWORK=mainnet and a server-injected mainnet viewing adapter
        supplies a current, internally consistent snapshot. Requires X-VeilPay-Operator-Token.
        It is read-only: it cannot create a wallet, prepare, sign, submit, or broadcast a
        transaction. The address, balance, sync height, and observations are wallet-reported;
        chainEvidence.trusted is always false because no independently pinned full-node evidence
        is configured.
      security:
      - operatorReadToken: []
      parameters:
      - $ref: '#/components/parameters/OperatorReadToken'
      responses:
        '200':
          description: Current mainnet wallet-reported snapshot; not independently verified chain evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainnetReadOnlySnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: NOT_FOUND when the configured network is not mainnet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: WALLET_UNAVAILABLE when no mainnet viewing adapter is configured or its snapshot is unsupported, stale, malformed, network-mismatched, or internally inconsistent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /session/demo:
    post:
      tags:
      - session
      summary: Issue the seeded demo session for one context
      description: Returns an httpOnly cookie. Customer and merchant contexts are separate; a customer session cannot
        call merchant routes and vice versa. Origin-checked and rate-limited. Available only when network is testnet
        or regtest (404 otherwise). Not production authentication. Exempt from X-CSRF-Token and Idempotency-Key
        (bootstrap exception), Origin still required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              properties:
                context:
                  type: string
                  enum:
                  - customer
                  - merchant
      responses:
        '200':
          description: session issued (Set-Cookie __Host-veilpay_session; HttpOnly; Secure; SameSite=Strict; Path=/;
            no Domain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: demo sessions disabled (non-test network)
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: rate limited
  /session:
    get:
      tags:
      - session
      summary: Current session context
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - session
      summary: Revoke the current authenticated session
      description: Revokes the server-side bearer token and clears its HttpOnly cookie. Requires the current session and CSRF token.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
  /agents:
    post:
      tags:
      - agents
      summary: Register an agent (customer context)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: IDEMPOTENCY_MISMATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-role: customer
      security:
      - session: []
  /agents/{agentId}:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    get:
      tags:
      - agents
      summary: Agent with live policy usage
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-role: customer
      security:
      - session: []
    patch:
      tags:
      - agents
      summary: Pause or resume an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/AgentStatus'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-role: customer
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /agents/{agentId}/policy:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    get:
      tags:
      - agents
      summary: Current policy (versioned)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-role: customer
      security:
      - session: []
    put:
      tags:
      - agents
      summary: Replace policy; bumps version. Requires current version (optimistic lock).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdate'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: policy version conflict (code VERSION_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-role: customer
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
  /payments/request:
    post:
      tags:
      - payments
      summary: Agent submits a payment request; backend evaluates policy
      description: 'Always returns a Payment with a decision. Rejection is a normal outcome: 201 + status=rejected
        + decision.violations. Replay with the same Idempotency-Key + same body returns the ORIGINAL response (the
        same 201 + body) with header Idempotent-Replay: true. Same key + different body returns 409 IDEMPOTENCY_MISMATCH.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestCreate'
      responses:
        '201':
          description: 'evaluated (authorized or rejected); also returned verbatim on same-key replay with header
            Idempotent-Replay: true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          headers:
            Idempotent-Replay:
              schema:
                type: string
                enum:
                - 'true'
              description: present on replay
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: IDEMPOTENCY_MISMATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-role: customer
      security:
      - session: []
  /payments:
    get:
      tags:
      - payments
      summary: List payments for the session's agent (customer context)
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PaymentStatus'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-role: customer
      security:
      - session: []
  /payments/{paymentId}:
    parameters:
    - $ref: '#/components/parameters/PaymentId'
    get:
      tags:
      - payments
      summary: One payment with decision + timeline
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-role: customer
      security:
      - session: []
  /payments/{paymentId}/execute:
    parameters:
    - $ref: '#/components/parameters/PaymentId'
    post:
      tags:
      - payments
      summary: Record a single durable execution attempt; live broadcasting disabled
      description: >-
        Current policy, budget, invoice eligibility and durable operation uniqueness are
        checked atomically. Mock mode retains atomic simulation. In zingo-cli mode this
        endpoint ONLY stages submitted/pending with requiresOperatorConfirmation=true;
        it never signs or broadcasts. Preparation and single-txid transmission require
        separate operator-terminal confirmations. Same-key retries replay the immutable
        original 202 snapshot. Different-key retries return current state without another
        wallet call. Startup/timer reconciliation only observes. Ambiguity holds reservations
        and never causes a resend. Disabled zingo mode still fails definitively before creation.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: submitted; also the ORIGINAL response on same-key replay; for a DIFFERENT-key duplicate,
            the current Payment state (no send)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: INVALID_TRANSITION (not authorized) or policy now violated (POLICY_REJECTED, payment moves
            to rejected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'WALLET_UNAVAILABLE: wallet unreachable BEFORE the transition; payment stays authorized;
            this response is NOT cached, so a retry with the same key retries. Never returned after the transition.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-role: customer
      security:
      - session: []
  /payments/{paymentId}/verification:
    parameters:
    - $ref: '#/components/parameters/PaymentId'
    get:
      tags:
      - merchant
      summary: Merchant-side receipt verification for this payment's invoice (merchant context)
      description: >-
        In zingo-cli mode, synchronizes the independent merchant wallet and matches only
        its decrypted Orchard outputs to this invoice receiver, exact amount, and expected
        txid. Requires complete scanning and three confirmations. Duplicate/conflicting
        receipts block acknowledgment. Reorg-related changes invalidate current reliance
        on prior acknowledgments. Returns only this invoice receipt, never raw history or
        private material. A foreign merchant receives 404. Mock verification is unchanged.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: VERIFICATION_UNAVAILABLE when the selected adapter lacks merchant scanning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: WALLET_UNAVAILABLE; malformed output, stale/incomplete scan, lock, pin, process, or network failure. No successful wallet outcome is inferred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-role: merchant
      security:
      - session: []
  /payments/{paymentId}/acknowledgment:
    parameters:
    - $ref: '#/components/parameters/PaymentId'
    post:
      tags:
      - merchant
      summary: Merchant acknowledges receipt (only after verification says received)
      description: The acknowledgment is a signed merchant statement, NOT a cryptographic proof of settlement. The
        UI must label it that way. Allowed when Verification.state=received, or state=late with confirmations >=
        confirmationsRequired and receivedZat == expectedZat. Never on underpaid, amount_mismatch,
        duplicate, conflicting or reorged. Real statements bind invoice, network, txid,
        amount, observation depth and timestamp using a server-held HMAC key. HMAC is
        server-authenticated and is not publicly verifiable settlement evidence.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 280
      responses:
        '201':
          description: acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: NOT_YET_RECEIVED, ALREADY_ACKNOWLEDGED, AMOUNT_MISMATCH, or VERIFICATION_UNAVAILABLE for unsupported adapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: WALLET_UNAVAILABLE; malformed output, stale/incomplete scan, lock, pin, process, or network failure. No successful wallet outcome is inferred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-role: merchant
      security:
      - session: []
  /merchant/invoices:
    post:
      tags:
      - merchant
      summary: Create a mock invoice or a real Orchard testnet receiving invoice
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reference
              - amountZat
              properties:
                reference:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: INV-1001
                amountZat:
                  allOf:
                  - $ref: '#/components/schemas/Zatoshi'
                  description: Canonical integer string in zatoshis, from 1 through 2100000000000000.
                expiresAt:
                  type: string
                  format: date-time
                  description: Must be in the future. Defaults to 24 hours after creation.
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: Invalid reference, amount, expiry, or idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: IDEMPOTENCY_MISMATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: WALLET_UNAVAILABLE; malformed output, stale/incomplete scan, lock, pin, process, or network failure. No successful wallet outcome is inferred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-role: merchant
      security:
      - session: []
    get:
      tags:
      - merchant
      summary: List this merchant's invoices
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-role: merchant
      security:
      - session: []
  /merchant/invoices/{id}:
    get:
      tags: [merchant]
      summary: Read an owned invoice and refresh its expiry status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Invoice; open invoices past expiry become expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Invoice missing or owned by another merchant
      x-role: merchant
      security:
      - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-veilpay_session
      description: HttpOnly, Secure, SameSite=Strict, Path=/, no Domain demo session cookie; carries context customer|merchant.
    operatorReadToken:
      type: apiKey
      in: header
      name: X-VeilPay-Operator-Token
      description: Server-configured operator token for the mainnet read-only endpoint. It is not a demo session or a transaction-signing credential.
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        pattern: ^agt_[A-Za-z0-9]{10,32}$
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        pattern: ^pay_[A-Za-z0-9]{10,32}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    OperatorReadToken:
      name: X-VeilPay-Operator-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    Invalid:
      description: VALIDATION_FAILED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: WRONG_CONTEXT (wrong role) or CSRF_FAILED (missing/invalid X-CSRF-Token or Origin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND (also returned for records outside the caller's scope, to avoid leaking existence)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Zatoshi:
      type: string
      pattern: ^(0|[1-9][0-9]{0,15})$
      description: Integer zatoshi as a decimal string. 1 ZEC = "100000000".
      example: '25000000'
    Health:
      type: object
      required:
      - status
      - network
      - wallet
      - chainHeight
      - confirmationsRequired
      - walletBackend
      - mode
      - reconciler
      - chainWatcher
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - down
        network:
          type: string
          enum:
          - testnet
          - regtest
          - mainnet
        wallet:
          type: string
          enum:
          - ready
          - syncing
          - unavailable
          - broadcast_disabled
          - operator_required
        walletBackend:
          type: string
          enum:
          - zingolib
          - zingo
          - zingo-cli
          - zallet
          - mock
        chainHeight:
          type:
          - integer
          - 'null'
        confirmationsRequired:
          type: integer
          minimum: 1
        mode:
          type: string
          enum:
          - real
          - mock
          - disabled
          - testnet_manual
          description: mock is simulation; disabled means the built-in Zingo adapter cannot broadcast or establish chain readiness.
        reconciler:
          type: object
          properties:
            lastRunAt:
              type:
              - string
              - 'null'
              format: date-time
            unresolved:
              type: integer
          required:
          - lastRunAt
          - unresolved
        chainWatcher:
          type: object
          description: supported=false means no independent header watcher; other fields do not assert chain safety.
          required:
          - lastBlockAt
          - watchDepth
          - deepReorgAlert
          properties:
            supported:
              type: boolean
              description: false in this implementation; reorg-related changes come from wallet observations.
            lastBlockAt:
              type:
              - string
              - 'null'
              format: date-time
            watchDepth:
              type: integer
            deepReorgAlert:
              type: boolean
    MainnetReadOnlySnapshot:
      type: object
      description: >-
        Operator-only mainnet snapshot. All balance, height, and transaction observations are
        reported by the viewing wallet. This response does not constitute independently verified
        blockchain evidence and cannot authorize a payment.
      required:
      - network
      - address
      - availableZat
      - sync
      - chainEvidence
      - observations
      properties:
        network:
          type: string
          const: mainnet
        address:
          type: string
          description: Mainnet Orchard-capable Unified Address reported by the viewing adapter.
        availableZat:
          $ref: '#/components/schemas/Zatoshi'
        sync:
          type: object
          required:
          - walletReportedHeight
          - stale
          properties:
            walletReportedHeight:
              type: integer
              minimum: 1
              description: Viewing wallet's reported synchronized chain height.
            stale:
              type: boolean
              const: false
              description: False only after the backend verifies equal nonzero wallet and reported chain heights.
        chainEvidence:
          type: object
          description: Explicit trust boundary for the returned wallet observation.
          required:
          - trusted
          - height
          - reason
          properties:
            trusted:
              type: boolean
              const: false
            height:
              type: 'null'
              description: No independently pinned chain height is configured.
            reason:
              type: string
        observations:
          type: array
          description: Wallet-reported received outputs, never independent settlement proof.
          items:
            type: object
            required:
            - txid
            - status
            - blockHeight
            - confirmations
            properties:
              txid:
                type: string
                pattern: '^[0-9a-f]{64}$'
              status:
                type: string
                enum: [confirmed, mempool, transmitted, calculated, failed]
              blockHeight:
                type: integer
                minimum: 0
              confirmations:
                type: integer
                minimum: 0
    Session:
      type: object
      required:
      - authenticated
      - context
      - expiresAt
      - csrfToken
      properties:
        authenticated:
          type: boolean
        accountId:
          type:
          - string
          - 'null'
        accountType:
          type:
          - string
          - 'null'
          enum: [individual, freelancer, merchant, team, business, null]
        context:
          type:
          - string
          - 'null'
          enum:
          - customer
          - merchant
        agentId:
          type:
          - string
          - 'null'
        merchantId:
          type:
          - string
          - 'null'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        csrfToken:
          type:
          - string
          - 'null'
          description: Send as X-CSRF-Token on every state-changing request.
    AgentStatus:
      type: string
      enum:
      - active
      - paused
    AgentCreate:
      type: object
      required:
      - name
      - policy
      properties:
        name:
          type: string
          maxLength: 64
        policy:
          $ref: '#/components/schemas/PolicyRules'
    Agent:
      type: object
      required:
      - id
      - name
      - status
      - policy
      - usage
      - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/AgentStatus'
        policy:
          $ref: '#/components/schemas/Policy'
        usage:
          $ref: '#/components/schemas/PolicyUsage'
        createdAt:
          type: string
          format: date-time
    PolicyRules:
      type: object
      required:
      - perTxLimitZat
      - totalBudgetZat
      - allowedMerchantIds
      properties:
        perTxLimitZat:
          $ref: '#/components/schemas/Zatoshi'
        totalBudgetZat:
          $ref: '#/components/schemas/Zatoshi'
        allowedMerchantIds:
          type: array
          items:
            type: string
          minItems: 1
        requestTtlSeconds:
          type: integer
          minimum: 30
          maximum: 86400
          default: 900
        expiresAt:
          type: string
          format: date-time
          description: Optional policy expiry. The backend rejects new requests after this time.
    Policy:
      allOf:
      - $ref: '#/components/schemas/PolicyRules'
      - type: object
        required:
        - version
        - updatedAt
        properties:
          version:
            type: integer
            minimum: 1
          updatedAt:
            type: string
            format: date-time
    PolicyUpdate:
      allOf:
      - $ref: '#/components/schemas/PolicyRules'
      - type: object
        required:
        - expectedVersion
        properties:
          expectedVersion:
            type: integer
            minimum: 1
    PolicyUsage:
      type: object
      required:
      - spentZat
      - reservedZat
      - remainingZat
      - approvedCount
      - rejectedCount
      - pendingCount
      properties:
        spentZat:
          $ref: '#/components/schemas/Zatoshi'
        reservedZat:
          $ref: '#/components/schemas/Zatoshi'
          description: authorized/submitted/confirming not yet confirmed
        remainingZat:
          $ref: '#/components/schemas/Zatoshi'
        approvedCount:
          type: integer
        rejectedCount:
          type: integer
        pendingCount:
          type: integer
    PaymentRequestCreate:
      type: object
      required:
      - agentId
      - invoiceId
      - amountZat
      - reference
      properties:
        agentId:
          type: string
        invoiceId:
          type: string
          description: The merchant invoice; backend resolves merchantId and destination from it.
        amountZat:
          $ref: '#/components/schemas/Zatoshi'
        reference:
          type: string
          maxLength: 64
        expiresAt:
          type: string
          format: date-time
          description: Optional; capped by policy requestTtlSeconds.
    PaymentStatus:
      type: string
      enum:
      - requested
      - rejected
      - authorized
      - submitted
      - confirming
      - confirmed
      - failed
      - expired
      description: "Backend-owned, one-way transitions:\n  requested  -> rejected | authorized\n  authorized ->\
        \ submitted | rejected (re-check at execute) | expired\n  submitted  -> confirming | failed\n  confirming\
        \ -> confirmed | failed\n  confirmed  -> confirming (reorg only)\n  confirming -> failed (only EXPIRED_UNMINED\
        \ after a reorg)\nTerminal: rejected, failed, expired. confirmed is final once past the configured finality\
        \ depth.\nUI copy: authorized = \"approved, not paid\"; confirming = \"sent, awaiting confirmation\";\n\
        only confirmed = \"paid\".\n"
    ViolationCode:
      type: string
      enum:
      - CAP_EXCEEDED
      - BUDGET_EXCEEDED
      - MERCHANT_NOT_ALLOWED
      - AGENT_PAUSED
      - REQUEST_EXPIRED
      - AMOUNT_MISMATCH
      - INVOICE_NOT_PAYABLE
      - POLICY_VERSION_CHANGED
      - POLICY_EXPIRED
    Violation:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ViolationCode'
        message:
          type: string
          example: 'Payment blocked: requested amount exceeds the authorized transaction limit.'
        limitZat:
          $ref: '#/components/schemas/Zatoshi'
        requestedZat:
          $ref: '#/components/schemas/Zatoshi'
    Decision:
      type: object
      required:
      - id
      - result
      - policyVersion
      - evaluatedAt
      - violations
      - auditHash
      properties:
        id:
          type: string
        result:
          type: string
          enum:
          - authorized
          - rejected
        policyVersion:
          type: integer
        evaluatedAt:
          type: string
          format: date-time
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
        auditHash:
          type: string
          description: sha256 of (request, policyVersion, result). Audit trail only, not proof of enforcement.
    TimelineEvent:
      type: object
      required:
      - status
      - kind
      - at
      properties:
        status:
          $ref: '#/components/schemas/PaymentStatus'
        at:
          type: string
          format: date-time
        note:
          type: string
        kind:
          type: string
          enum:
          - status
          - reorg
          - reconciled
          - policy_changed
          - agent_paused
          - late_receipt
          - verification
          - wallet
    Payment:
      type: object
      required:
      - id
      - agentId
      - merchantId
      - invoiceId
      - amountZat
      - reference
      - status
      - decision
      - timeline
      - createdAt
      properties:
        id:
          type: string
        agentId:
          type: string
        merchantId:
          type: string
        merchantName:
          type: string
        invoiceId:
          type: string
        amountZat:
          $ref: '#/components/schemas/Zatoshi'
        reference:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        decision:
          $ref: '#/components/schemas/Decision'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        pool:
          type:
          - string
          - 'null'
          enum:
          - orchard
          - sapling
          - null
          description: Shielded pool used, once submitted.
        confirmations:
          type: integer
          minimum: 0
        txid:
          type:
          - string
          - 'null'
          description: Actual signed transaction ID in manual testnet mode, including before broadcast when phase=prepared. Presence alone does not establish submission or inclusion. Always null in mock mode.
        failure:
          type:
          - object
          - 'null'
          properties:
            code:
              type: string
              enum:
              - REJECTED_BY_WALLET_PRE_BROADCAST
              - INSUFFICIENT_FUNDS
              - BROADCAST_REJECTED
              - EXPIRED_UNMINED
              - OUTCOME_UNKNOWN
              - WALLET_BROADCAST_DISABLED
            message:
              type: string
            retriable:
              type: boolean
            definitive:
              type: boolean
              description: true = terminal failure, reservation released. false = uncertain (OUTCOME_UNKNOWN), reservation
                held.
          required:
          - code
          - definitive
          - retriable
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        privacy:
          $ref: '#/components/schemas/PrivacyLens'
        mockRef:
          type:
          - string
          - 'null'
          pattern: '^mock_[0-9a-f]{32}$'
          description: 'Mock mode only: generated synthetic reference, never formatted like a txid.'
        walletOperation:
          $ref: '#/components/schemas/WalletOperation'
    PrivacyLens:
      type: object
      description: Drives the "what's hidden" panel. Static per pool, filled by backend.
      properties:
        publicChainSees:
          type: array
          items:
            type: string
          example:
          - txid
          - block time
          - fee
          - transaction structure
        hiddenOnChain:
          type: array
          items:
            type: string
          example:
          - amount
          - sender address
          - recipient address
          - memo
        merchantSees:
          type: array
          items:
            type: string
          example:
          - amount received
          - invoice reference
          - confirmations
        customerSees:
          type: array
          items:
            type: string
    Invoice:
      type: object
      required:
      - id
      - merchantId
      - reference
      - amountZat
      - status
      - createdAt
      properties:
        id:
          type: string
        merchantId:
          type: string
        reference:
          type: string
        amountZat:
          $ref: '#/components/schemas/Zatoshi'
        payTo:
          type: string
          description: Unique demo receiver in mock mode; fresh Orchard-only utest1 address in zingo-cli mode.
        network:
          type: string
          enum: [testnet]
          description: Present for real testnet invoices. Legacy mock invoices omit it.
        paymentPayload:
          type: object
          description: Demo payloads must never be sent to a wallet. Only zip321/testnet payloads are spendable testnet requests.
          oneOf:
          - required: [format, uri, mock, spendable]
            properties:
              format: {type: string, const: veilpay-mock-v1}
              uri: {type: string}
              mock: {type: boolean, const: true}
              spendable: {type: boolean, const: false}
          - required: [format, uri, mock, spendable, network]
            properties:
              format: {type: string, const: zip321}
              uri:
                type: string
                description: ZIP-321 URI with an exact eight-decimal ZEC amount; invoice expiry is enforced separately by VeilPay.
              network: {type: string, const: testnet}
              mock: {type: boolean, const: false}
              spendable: {type: boolean, const: true}
        status:
          type: string
          enum:
          - open
          - paid
          - paid_late
          - expired
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    Verification:
      type: object
      required:
      - paymentId
      - invoiceId
      - state
      - confirmations
      - confirmationsRequired
      - checkedAt
      - method
      - mock
      properties:
        paymentId:
          type: string
        invoiceId:
          type: string
        reference:
          type: string
        state:
          type: string
          enum:
          - not_seen
          - pending
          - received
          - late
          - amount_mismatch
          - expired
          - underpaid
          - duplicate
          - conflicting
          - reorged
        expectedZat:
          $ref: '#/components/schemas/Zatoshi'
        receivedZat:
          $ref: '#/components/schemas/Zatoshi'
        confirmations:
          type: integer
        confirmationsRequired:
          type: integer
        method:
          type: string
          enum:
          - merchant_ivk_scan
          - merchant_wallet_scan
          - mock
          description: 'merchant_wallet_scan uses independently decrypted wallet history; it is not a settlement proof. merchant_ivk_scan (real mode only): operator-held, account-wide merchant IVK scan, server-side;
            custodial, not a per-payment disclosure proof. mock: simulated, no chain read.'
        checkedAt:
          type: string
          format: date-time
        mock:
          type: boolean
        late:
          type: boolean
        network:
          type: string
          enum: [testnet]
        txid:
          type: [string, 'null']
        blockHeight:
          type: integer
        tipHeight:
          type: integer
        acknowledgmentEligible:
          type: boolean
          description: Current observation is sufficient to issue a merchant statement.
        acknowledgmentValid:
          type: boolean
          description: An existing statement is still eligible for current reliance and has not been invalidated.
    Acknowledgment:
      type: object
      required:
      - paymentId
      - merchantId
      - at
      - signature
      properties:
        paymentId:
          type: string
        merchantId:
          type: string
        at:
          type: string
          format: date-time
        note:
          type: string
        signature:
          type: string
          description: Server-held HMAC-SHA256 statement. Real mode additionally binds invoice, network, txid, observed depth and the statement label. Not a publicly verifiable settlement proof.
        evidence:
          $ref: '#/components/schemas/Verification'
        statementType:
          type: string
          enum:
          - merchant_acknowledgment_not_settlement_proof
          - merchant_acknowledgment_simulation_not_settlement_proof
          description: The mock variant explicitly records a simulation, never independent blockchain settlement.
        invalidatedAt:
          type: string
          format: date-time
        invalidationReason:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - VALIDATION_FAILED
          - UNAUTHENTICATED
          - WRONG_CONTEXT
          - NOT_FOUND
          - VERSION_CONFLICT
          - IDEMPOTENCY_MISMATCH
          - INVALID_TRANSITION
          - POLICY_REJECTED
          - NOT_YET_RECEIVED
          - ALREADY_ACKNOWLEDGED
          - WALLET_UNAVAILABLE
          - INTERNAL
          - OUTCOME_UNKNOWN
          - CSRF_FAILED
          - AMOUNT_MISMATCH
          - VERIFICATION_UNAVAILABLE
        message:
          type: string
          description: Safe for display. Never contains addresses, keys, amounts of other records or stack traces.
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
    WalletOperation:
      type:
      - object
      - 'null'
      description: Durable send record (customer context only). Never contains keys or addresses.
      properties:
        id:
          type: string
        state:
          type: string
          enum:
          - pending
          - broadcast
          - mined
          - final
          - failed_definitive
          - unknown
        attempt:
          type: integer
          const: 1
        lastReconciledAt:
          type:
          - string
          - 'null'
          format: date-time
        requiresOperatorConfirmation:
          type: boolean
        phase:
          type: string
          enum: [awaiting_operator, preparing, prepared, submitting, observing]
        feeZat:
          $ref: '#/components/schemas/Zatoshi'
        needsOperator:
          type: boolean
          description: true when unresolved past the reconcile window; never auto-resent.
      required:
      - id
      - state
      - attempt
      - needsOperator
