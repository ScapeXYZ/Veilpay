name: CI

on:
  pull_request:
    branches: [main, integration/veilpay-milestone6]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-openapi.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run

  backend:
    name: Rust mock-only backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WALLET_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --check
        working-directory: backend
      - run: cargo clippy -- -D warnings
        working-directory: backend
      - run: cargo test
        working-directory: backend

  production-build:
    name: Production Next.js build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WALLET_BACKEND: mock
      NEXT_PUBLIC_API_MODE: live
      NEXT_PUBLIC_API_BASE: /api
      VEILPAY_BACKEND_URL: http://127.0.0.1:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with bounded diagnostics
        shell: bash
        run: |
          set -o pipefail
          timeout 300s npm run build 2>&1 | tee production-build.log
      - name: Upload production build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: production-build.log
          if-no-files-found: warn
          retention-days: 7
